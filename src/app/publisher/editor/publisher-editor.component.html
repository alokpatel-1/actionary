<div class="publisher-editor-page">

  <!-- Unified Top Header Navigation -->
  <header class="app-top-nav">
    <div class="nav-inner">
      <!-- Left: Back to Workspace Link -->
      <div class="left-group">
        <a routerLink="/new/publisher/dashboard" class="btn-back">
          <i class="pi pi-arrow-left"></i>
          <span>Workspace</span>
        </a>
      </div>

      <!-- Center: Premium Status & Word Count Badge -->
      <div class="center-group" *ngIf="isReady() && noteEditor">
        <div class="editor-status-pill">
          <!-- Saving state -->
          <span class="status-indicator saving" *ngIf="noteEditor.saving()">
            <i class="pi pi-spin pi-spinner"></i>
            <span>Saving…</span>
          </span>

          <!-- Saved state -->
          <span class="status-indicator saved" *ngIf="!noteEditor.saving()">
            <i class="pi pi-check-circle"></i>
            <span>Saved</span>
          </span>

          <span class="stat-sep">•</span>

          <span class="stats-info">
            <strong>{{ noteEditor.wordCount() }}</strong> words
            <span class="dot-sep">·</span>
            <strong>{{ noteEditor.readingTime() }}</strong> min read
          </span>
        </div>
      </div>

      <!-- Right: Action Buttons -->
      <div class="right-group">
        <button (click)="saveDraft()" class="btn-save-draft">
          <i class="pi pi-save"></i>
          <span>Save Draft</span>
        </button>

        <button (click)="publish()" class="btn-publish">
          <i class="pi pi-send"></i>
          <span>Publish Note</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Full Rich Note Editor Component -->
  <div class="rich-editor-wrapper">
    <app-note-editor></app-note-editor>
  </div>

</div>

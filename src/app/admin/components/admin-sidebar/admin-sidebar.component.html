<aside class="app-sidebar">
  <div class="sidebar-header">
    <div class="brand-container">
      <div class="brand-logo"><i class="pi pi-shield"></i></div>
      <h2 class="brand-name">Admin Portal</h2>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section">
      <span class="section-title">Core</span>
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        <i class="pi pi-chart-pie nav-icon"></i>
        <span class="nav-label">Dashboard</span>
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
        <i class="pi pi-users nav-icon"></i>
        <span class="nav-label">User Management</span>
      </a>
      <a routerLink="/admin/content" routerLinkActive="active" class="nav-item">
        <i class="pi pi-flag nav-icon"></i>
        <span class="nav-label">Content Moderation</span>
      </a>
      <a routerLink="/admin/audit" routerLinkActive="active" class="nav-item">
        <i class="pi pi-list nav-icon"></i>
        <span class="nav-label">Audit Logs</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-footer-wrapper">
    <div class="sidebar-footer" (click)="logout()" title="Logout">
      <div class="user-info">
        <div class="user-avatar-placeholder">A</div>
        <div class="user-details">
          <span class="user-name">Administrator</span>
          <span class="user-email">admin&#64;admin.com</span>
        </div>
      </div>
      <button class="btn-logout" tabindex="-1">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </div>
</aside>

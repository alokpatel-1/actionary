<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <a routerLink="/" class="brand-logo">
        <span class="brand-icon">📝</span>
        <span class="brand-name">Scribe</span>
      </a>
      <h1>Reset Password</h1>
      <p>Enter your email to receive password reset instructions.</p>
    </div>

    <ng-container *ngIf="!sent(); else successTpl">
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="reset-email">Email Address</label>
          <div class="input-wrapper">
            <i class="pi pi-envelope input-icon"></i>
            <input id="reset-email" formControlName="email" type="email" placeholder="you@example.com" />
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <span>Send Reset Link</span>
        </button>
      </form>
    </ng-container>

    <ng-template #successTpl>
      <div class="success-box">
        <i class="pi pi-check-circle success-icon"></i>
        <h2>Check Your Inbox</h2>
        <p>Password reset instructions have been sent to <strong>{{ sentEmail() }}</strong>.</p>
        <a routerLink="/new/auth/login" class="btn-submit return-btn">Return to Log In</a>
      </div>
    </ng-template>

    <div class="auth-footer" *ngIf="!sent()">
      <p>Remembered your password? <a routerLink="/new/auth/login" class="highlight-link">Sign In</a></p>
    </div>
  </div>
</div>

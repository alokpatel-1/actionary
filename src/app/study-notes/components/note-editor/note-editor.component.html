  <!-- Templates to be dynamically projected into the full screen top navbar -->
  <ng-template #editorStatus>
    <div class="bar-center">
      <span class="save-dot saving" *ngIf="saving()"></span>
      <span class="save-label" *ngIf="saving()">Saving…</span>
      <span class="save-dot saved" *ngIf="!saving() && lastSaved()"></span>
      <span class="save-label saved" *ngIf="!saving() && lastSaved()">Saved</span>
      <!-- Word count stats -->
      <span class="word-count-stat" *ngIf="wordCount() > 0">
        {{ wordCount() }} words · {{ charCount() }} chars · {{ readingTime() }} min read
      </span>
    </div>
  </ng-template>

  <ng-template #editorActions>
    <div class="bar-right">
      <!-- Sync Status Group -->
      <div class="editor-sync-group">
        <span class="sync-badge syncing" *ngIf="noteService.sync.syncStatus() === 'started'" title="Syncing with Firebase...">
          <i class="pi pi-spin pi-spinner"></i>
        </span>
        <span class="sync-badge synced" *ngIf="noteService.sync.syncStatus() === 'completed'" title="Synced with Firebase">
          <i class="pi pi-check-circle"></i>
        </span>
        <span class="sync-badge failed" *ngIf="noteService.sync.syncStatus() === 'failed'" [title]="'Sync failed: ' + noteService.sync.syncError()">
          <i class="pi pi-exclamation-circle"></i>
        </span>
        <button class="bar-btn manual-sync-btn"
                (click)="triggerManualSync()"
                [disabled]="noteService.sync.syncStatus() === 'started'"
                title="Sync now">
          <i class="pi"
             [class.pi-refresh]="noteService.sync.syncStatus() !== 'started'"
             [class.pi-spin]="noteService.sync.syncStatus() === 'started'"
             [class.pi-spinner]="noteService.sync.syncStatus() === 'started'"></i>
        </button>
      </div>

      <button *ngIf="!isEditMode()" class="edit-btn-pill" (click)="enableEditMode()" title="Edit note">
        <i class="pi pi-pencil"></i>
        <span>Edit</span>
      </button>
      <button *ngIf="isEditMode()" class="save-btn-pill" (click)="save(true)" [disabled]="saving()" title="Save note">
        <i class="pi" [ngClass]="saving() ? 'pi-spin pi-spinner' : 'pi-save'"></i>
        <span>Save</span>
      </button>
      <button class="bar-btn" *ngIf="!isNew()" (click)="goToReadMode()" title="Read Mode">
        <i class="pi pi-book"></i>
        <span>Read Mode</span>
      </button>
    </div>
  </ng-template>

<div class="editor-page">
  <!-- Content Wrapper for Medium-like centered column -->
  <div class="content-container">

    <!-- Standalone Editor Toolbar when rendered outside StudyNotesComponent shell -->
    <div class="standalone-editor-toolbar" *ngIf="!studyNotes">
      <div class="toolbar-left">
        <span class="save-dot saving" *ngIf="saving()"></span>
        <span class="save-label" *ngIf="saving()">Saving…</span>
        <span class="save-dot saved" *ngIf="!saving() && lastSaved()"></span>
        <span class="save-label saved" *ngIf="!saving() && lastSaved()">Saved</span>
        <span class="word-count-stat" *ngIf="wordCount() > 0">
          {{ wordCount() }} words · {{ charCount() }} chars · {{ readingTime() }} min read
        </span>
      </div>

      <div class="toolbar-right">
        <button *ngIf="!isEditMode()" class="edit-btn-pill" (click)="enableEditMode()" title="Edit note">
          <i class="pi pi-pencil"></i>
          <span>Edit</span>
        </button>
        <button *ngIf="isEditMode()" class="save-btn-pill" (click)="save(true)" [disabled]="saving()" title="Save note">
          <i class="pi" [ngClass]="saving() ? 'pi-spin pi-spinner' : 'pi-save'"></i>
          <span>Save</span>
        </button>
      </div>
    </div>

    <!-- Tags & Status Row (edit mode only) -->
    <div class="meta-row" *ngIf="isEditMode() && tags().length > 0 || isEditMode()">
      <!-- Tags -->
      <div class="tags-row">
        <span class="tag-chip" *ngFor="let tag of tags()">
          #{{ tag }}
          <button class="tag-remove" (click)="removeTag(tag)" title="Remove tag">&times;</button>
        </span>
        <div class="tag-input-container" style="position: relative; display: inline-block;">
          <input class="tag-input"
                 type="text"
                 placeholder="Add tag…"
                 [ngModel]="tagInput()"
                 (ngModelChange)="tagInput.set($event)"
                 (keydown)="onTagKeydown($event)"
                 (focus)="onTagFocus()"
                 (blur)="onTagBlur()"
                 maxlength="30">

          <!-- Autocomplete suggestions dropdown -->
          <div class="editor-tag-suggestions" *ngIf="tagInputFocused() && matchingTags().length > 0">
            <button type="button"
                    class="editor-suggestion-item" 
                    *ngFor="let suggestion of matchingTags()"
                    (mousedown)="addTagFromSuggestion(suggestion)">
              #{{ suggestion }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tags display row (read/preview mode) -->
    <div class="meta-row read-meta-row" *ngIf="!isEditMode() && tags().length > 0">
      <span class="tag-chip read-tag" *ngFor="let tag of tags()">#{{ tag }}</span>
    </div>

    <!-- Title Preview Mode -->
    <h1 *ngIf="!isEditMode()" class="note-title-preview">{{ title() || 'Untitled Note' }}</h1>

    <!-- Title Edit Mode -->
    <input *ngIf="isEditMode()"
           type="text"
           class="note-title"
           [value]="title()"
           (input)="onTitleChange($any($event.target).value)"
           placeholder="Untitled Note"
           autocomplete="off"
           spellcheck="true"
           maxlength="100">

    <!-- Tiptap Editor Area -->
    <div class="editor-area" *ngIf="editor" (click)="focusEditor($event)">
      
      <!-- Bubble Menu (Shown on highlight) -->
      <div tiptapBubbleMenu [editor]="editor" class="bubble-menu" *ngIf="isEditMode()">
        <button (click)="editor.chain().focus().toggleBold().run()" [class.is-active]="editor.isActive('bold')"><strong style="font-weight: 700;">B</strong></button>
        <button (click)="editor.chain().focus().toggleItalic().run()" [class.is-active]="editor.isActive('italic')"><em style="font-style: italic;">I</em></button>
        <button (click)="editor.chain().focus().toggleUnderline().run()" [class.is-active]="editor.isActive('underline')"><u style="text-decoration: underline;">U</u></button>
        <div class="divider"></div>
        <div class="text-color-group" title="Text color">
          <div class="text-color-swatches">
            <button *ngFor="let c of textColors"
                    type="button"
                    class="swatch text-color-swatch"
                    [class.default-swatch]="c.color === null"
                    [style.color]="c.color || null"
                    [class.is-active]="isTextColorActive(c.color)"
                    (mousedown)="keepEditorSelection($event)"
                    (click)="setTextColor(c.color)"
                    [title]="c.label">
              <span *ngIf="c.color === null" class="default-swatch-label">Aa</span>
              <span *ngIf="c.color !== null">A</span>
            </button>
          </div>
        </div>
        <div class="divider"></div>
        <button (click)="editor.chain().focus().toggleHeading({ level: 1 }).run()" [class.is-active]="editor.isActive('heading', { level: 1 })">H1</button>
        <button (click)="editor.chain().focus().toggleHeading({ level: 2 }).run()" [class.is-active]="editor.isActive('heading', { level: 2 })">H2</button>
        <div class="divider"></div>
        <button (click)="editor.chain().focus().toggleBlockquote().run()" [class.is-active]="editor.isActive('blockquote')"><i class="pi pi-comment"></i></button>
        <button (click)="editor.chain().focus().toggleCode().run()" [class.is-active]="editor.isActive('code')"><i class="pi pi-code"></i></button>
      </div>

      <!-- Floating Menu (Shown on empty line) -->
      <div tiptapFloatingMenu [editor]="editor" class="floating-menu" *ngIf="isEditMode()">
        <button class="plus-btn" (click)="editor.chain().focus().toggleHeading({ level: 1 }).run()" title="Heading 1 (Ctrl+Alt+1)">H1</button>
        <button class="plus-btn" (click)="editor.chain().focus().toggleBulletList().run()" title="Bullet List (Ctrl+Shift+8)"><i class="pi pi-list"></i></button>
        <button class="plus-btn" (click)="editor.chain().focus().toggleBlockquote().run()" title="Blockquote (Ctrl+Shift+B)"><i class="pi pi-comment"></i></button>
        <button class="plus-btn" (click)="editor.chain().focus().setHorizontalRule().run()" title="Divider"><i class="pi pi-minus"></i></button>
        <button class="plus-btn" (click)="editor.chain().focus().toggleCodeBlock().run()" title="Code Block (Ctrl+Alt+C)"><i class="pi pi-code"></i></button>
        <button type="button" class="plus-btn" (mousedown)="keepEditorSelection($event)" (click)="setTextColor(textColors[3].color)" title="Text color"><span class="color-icon" [style.color]="textColors[3].color">A</span></button>
        <button type="button" class="plus-btn" (mousedown)="keepEditorSelection($event)" (click)="setTextColor(null)" title="Default text color"><span class="color-icon default-color-icon">Aa</span></button>
      </div>

      <!-- Main Editor Content -->
      <tiptap-editor [editor]="editor" class="tiptap-editor-wrapper" [class.preview-mode]="!isEditMode()"></tiptap-editor>

    </div>
  </div>
</div>
